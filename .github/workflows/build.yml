name: Build module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The private release key, from the repository secrets, so every build updates the
      # previous one. This repository refuses to build without it (an APK with another key
      # cannot update the installed module); forks and pull requests build debug-signed.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed with the release key"
          elif { [ "${{ github.repository }}" = "Dr-Essence/Nothing-Launcher-Plus" ] || [ "${{ github.repository }}" = "Dr-Essence/Nothing2Something" ]; } && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is not set - add the release key secrets (README, Updates and signing)"
            exit 1
          else
            echo "::warning::no release key - debug-signed build, it cannot update an installed release"
          fi

      # Gradle itself is downloaded by the wrapper from GitHub's releases; a short outage there
      # (HTTP 504, seen on 0.63.1 and 0.64.0) failed the build before any code was compiled.
      # Fetched first, up to four times, so a passing hiccup no longer fails the build.
      - name: Fetch Gradle
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $attempt), trying again in 30 s"
            sleep 30
          done
          exit 1

      # The runner image ships the Android SDK; ANDROID_HOME is already set.
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: Nothing2Something
          path: app/build/outputs/apk/release/*.apk
