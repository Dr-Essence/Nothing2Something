name: Inspect firmware files

# Runs tools/firmware-inspect.sh on one nothing_archive build (unpacked here with
# tools/firmware-collect.sh) and prints what it finds to this job's log, so firmware can be
# read without downloading it. Edit BUILD and the script, then push: it runs on every change.

on:
  push:
    paths:
      - .github/workflows/firmware-inspect.yml
      - tools/firmware-inspect.sh

permissions:
  contents: read
  actions: read

env:
  ARCHIVE: spike0en/nothing_archive
  PACKAGES: com.nothing.launcher
  # The build to inspect: the CMF Phone 1's newest Nothing OS 4.0.
  BUILD: Tetris_B4.0-260225-1904

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full erofs-utils erofsfuse > /dev/null
          echo "AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/firmware-inspect.sh "$BUILD"
