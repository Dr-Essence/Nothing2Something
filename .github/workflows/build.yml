name: Build module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The private release key, from the repository secrets, so every build updates the
      # previous one. This repository refuses to build without it (an APK with another key
      # cannot update the installed module); forks and pull requests build debug-signed.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed with the release key"
          elif { [ "${{ github.repository }}" = "Dr-Essence/Nothing-Launcher-Plus" ] || [ "${{ github.repository }}" = "Dr-Essence/Nothing2Something" ]; } && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is not set - add the release key secrets (README, Updates and signing)"
            exit 1
          else
            echo "::warning::no release key - debug-signed build, it cannot update an installed release"
          fi

      # Gradle itself: on 9 Nov 2026 GitHub's release storage, where services.gradle.org
      # redirects, answered HTTP 504 to the runners for over ten minutes (0.63.1, 0.64.0 and
      # four retries failed before compiling). So the zip is fetched here from several places in
      # turn, each checked against the official checksum (gradle.org/release-checksums, Gradle 8.14.3 -bin; not from a
      # download, which was a 504 error page), and the wrapper is pointed at the checked file.
      - name: Fetch Gradle
        run: |
          want=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          for url in \
              https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
              https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-bin.zip \
              https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip \
              https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip; do
            for attempt in 1 2; do
              if curl -fsSL --retry 2 --max-time 300 -o "$zip" "$url" \
                  && echo "$want  $zip" | sha256sum -c -; then
                echo "Gradle from $url"
                sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$zip#" \
                    gradle/wrapper/gradle-wrapper.properties
                exit 0
              fi
              echo "Not from $url (attempt $attempt)"
              sleep 10
            done
          done
          exit 1

      # The runner image ships the Android SDK; ANDROID_HOME is already set.
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: Nothing2Something
          path: app/build/outputs/apk/release/*.apk
