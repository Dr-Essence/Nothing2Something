name: Nothing OS firmware files

# Collects, for every Nothing and CMF phone, the system files the module hooks, so new
# Nothing OS builds (and phones other than the CMF Phone 1) can be reverse engineered without a
# tester's dump and without filling the development machine's disk.
#
# Source: github.com/spike0en/nothing_archive, which rebuilds Nothing's official OTA updates
# (from Nothing's own servers) into partition images. For each phone it publishes one release
# per build; this workflow takes the newest build of each Nothing OS version (1.x ... 5.x) of
# each phone, unpacks only system, system_ext and product, and keeps:
#   - the apps the module hooks (found by package name, wherever the build puts them);
#   - the framework and system_server code (framework.jar, services.jar, framework-res.apk);
#   - the emoji font and fonts.xml, and the build.prop files (build fingerprint).
# Each build is uploaded as a workflow artifact kept 7 days (Nothing's files are not committed
# to this repository), plus one small index of every build's apps and versions.
#
# Run it from the Actions tab (Run workflow). "tags" limits it to some builds, e.g.
# "Pacman_C5.0-261015-1824,Metroid_C5.0-260924-2115"; empty means every phone.

on:
  # Also when this file changes, so a new version of it runs once on its own branch (the Run
  # workflow button only lists workflows that are on the default branch).
  push:
    paths:
      - .github/workflows/firmware.yml
      - tools/firmware-collect.sh
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated nothing_archive tags (empty: newest build of each Nothing OS version of every phone)"
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCHIVE: spike0en/nothing_archive
  # The packages the module hooks (Hooks / the LSPosed scope).
  # The packages the module hooks (Hooks / the LSPosed scope), and the apps that supply Nothing's
  # widgets ("cards": Card Lab, the card service, weather, AI widget), whose card layouts decide
  # which parts of a widget Nothing OS 5 frosts.
  PACKAGES: com.nothing.launcher com.android.systemui com.android.settings com.android.settings.intelligence com.nothing.ntgamedashboard com.nothing.thirdparty com.nothing.hearthstone com.nothing.cardservice com.nothing.weather com.nothing.aiwidget

jobs:
  builds:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event.inputs.tags }}
        run: |
          # Every release tag looks like Pacman_C5.0-261015-1824: phone, letter + Nothing OS
          # version, date, time. The newest of each (phone, major version) is kept.
          if [ -n "$WANTED" ]; then
            tags=$(echo "$WANTED" | tr ',' '\n' | sed 's/ //g' | grep . )
          else
            gh api --paginate "repos/$ARCHIVE/releases?per_page=100" --jq '.[].tag_name' > all.txt
            tags=$(python3 - <<'EOF'
          import re
          best = {}
          for t in open("all.txt").read().split():
              m = re.match(r"([A-Za-z]+)_[A-Z](\d+)\.[\d.]+-(\d{6})-(\d{4})$", t)
              if not m:
                  continue
              phone, major, day, time = m.groups()
              key = (phone, major)
              if key not in best or day + time > best[key][0]:
                  best[key] = (day + time, t)
          print("\n".join(v[1] for _, v in sorted(best.items())))
          EOF
            )
          fi
          echo "$tags"
          echo "tags=$(echo "$tags" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  files:
    needs: builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJson(needs.builds.outputs.tags) }}
    steps:
      - uses: actions/checkout@v5
      # A build's partition archive is ~4.5 GB and its images ~8 GB: the runner's preinstalled
      # toolchains that this job does not use are removed first to make room.
      - name: Make disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full erofs-utils erofsfuse > /dev/null
          # aapt2 (reads an APK's package name and version) from the runner's Android SDK.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - name: Unpack and collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ matrix.tag }}"
          bash tools/firmware-collect.sh "$T" out
          OUT="$PWD/out/$T"
          echo "## $T" >> "$GITHUB_STEP_SUMMARY"
          for want in $PACKAGES; do
            grep " $want " "$OUT/index.txt" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || echo "    $want: not in this build" >> "$GITHUB_STEP_SUMMARY"
          done
          grep -h 'ro.build.fingerprint\|ro.system.build.fingerprint' -r "$OUT" | head -2 >> "$GITHUB_STEP_SUMMARY" || true
          du -sh "$OUT"; cat "$OUT/index.txt" | grep -E "$(echo $PACKAGES | tr ' ' '|')" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nos-${{ matrix.tag }}
          path: out
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.tag }}
          path: out/${{ matrix.tag }}/index.txt
          retention-days: 30
